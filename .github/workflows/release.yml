name: Release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds a binary per platform and attaches it to a GitHub Release.
# install.sh downloads these assets.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (required by LanceDB)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin memori --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/memori"
          tar -czf "memori-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" memori
          shasum -a 256 "memori-${{ matrix.target }}.tar.gz" > "memori-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/memori.exe"
          Compress-Archive -Path $bin -DestinationPath "memori-${{ matrix.target }}.zip"
          (Get-FileHash "memori-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower() | Out-File "memori-${{ matrix.target }}.zip.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            memori-${{ matrix.target }}.tar.gz
            memori-${{ matrix.target }}.tar.gz.sha256
            memori-${{ matrix.target }}.zip
            memori-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: false
