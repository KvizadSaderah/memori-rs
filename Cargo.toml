[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
members = [
    "crates/memori-core",
    "crates/memori",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Dmitry Efremov <KvizadSaderah@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/KvizadSaderah/memori-rs"
readme = "README.md"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# time
chrono = { version = "0.4", features = ["serde"] }

# error handling
thiserror = "2"
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# vector storage
lancedb = "0.29"
arrow-array = "58"
arrow-schema = "58"

# embeddings
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub"] }

# MCP
rmcp = { version = "0.1", features = ["server", "transport-io"] }

# CLI
clap = { version = "4", features = ["derive"] }

# misc
base64 = "0.22"
once_cell = "1"
futures = "0.3"
dirs = "5"
toml = "0.8"
